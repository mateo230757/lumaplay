name: Build LumaPlay Windows Installer

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lumaplay-windows-release
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Compile and package Windows x64
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Compile LumaPlay in the build runner
        shell: pwsh
        run: |
          & "Fuente/LumaPlay_Project/Build.ps1" -OutputDirectory "Fuente/LumaPlay_Project/publish"
          if ($LASTEXITCODE -ne 0) { throw "No se pudo compilar LumaPlay." }
          $app = "Fuente/LumaPlay_Project/publish/LumaPlay.exe"
          if (-not (Test-Path $app)) { throw "No se generó LumaPlay.exe." }
          Write-Host "Ejecutando prueba automática de inicio..."
          & $app --self-test
          if ($LASTEXITCODE -ne 0) {
            Get-Content "$env:LOCALAPPDATA/LumaPlay/startup.log" -ErrorAction SilentlyContinue
            throw "LumaPlay no superó la prueba de inicio."
          }

      - name: Install Inno Setup 6
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw "No se pudo instalar Inno Setup en el runner." }

      - name: Build graphical installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "artifacts" | Out-Null
          $compiler = "C:/Program Files (x86)/Inno Setup 6/ISCC.exe"
          if (-not (Test-Path $compiler)) { throw "No se encontró ISCC.exe de Inno Setup." }
          & $compiler "/Qp" "Fuente/LumaPlay_Project/installer/LumaPlay.iss"
          if ($LASTEXITCODE -ne 0) { throw "Falló la compilación del instalador Inno Setup." }
          $installer = "artifacts/LumaPlay_Setup.exe"
          if (-not (Test-Path $installer)) { throw "No se produjo artifacts/LumaPlay_Setup.exe." }
          $hash = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  LumaPlay_Setup.exe" | Set-Content -Path "artifacts/SHA256SUMS.txt" -Encoding ascii

      - name: Publish latest installer release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest
          target_commitish: ${{ github.sha }}
          name: LumaPlay — última versión para Windows
          body: |
            Instalador oficial de LumaPlay 1.1.2 para Windows x64.

- Manifiesto de compatibilidad Windows 10/11 incluido.
- La compilación se prueba con --self-test antes de publicar.

            - Asistente gráfico con Siguiente / Atrás.
            - Aplicación precompilada.
            - No requiere instalar C#, Visual Studio, Build Tools ni compilador en el PC del usuario.
            - En Windows 10 22H2 y Windows 11, .NET Framework compatible ya forma parte del sistema.

            Build de GitHub Actions: ${{ github.sha }}
          files: |
            artifacts/LumaPlay_Setup.exe
            artifacts/SHA256SUMS.txt
          fail_on_unmatched_files: true
          overwrite_files: true
          make_latest: true
